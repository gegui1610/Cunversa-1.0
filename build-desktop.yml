name: Gerar app Windows (.exe)

# Roda quando você clica em "Run workflow" (aba Actions) ou quando cria uma tag tipo v1.0.0.
# NÃO precisa rodar a cada atualização do site: o app abre o site direto do GitHub Pages.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descobrir a URL do site (GitHub Pages)
        shell: bash
        working-directory: desktop
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "$OWNER.github.io" ]; then URL="https://$REPO/"; else URL="https://$OWNER.github.io/$REPO/"; fi
          echo "URL do site: $URL"
          node -e "const fs=require(\"fs\");const c=JSON.parse(fs.readFileSync(\"config.json\",\"utf8\"));if(!c.siteUrl||c.siteUrl===\"AUTO\"){c.siteUrl=process.argv[1];fs.writeFileSync(\"config.json\",JSON.stringify(c,null,2))}console.log(fs.readFileSync(\"config.json\",\"utf8\"))" "$URL"

      - name: Instalar dependências
        working-directory: desktop
        run: npm install

      - name: Gerar o .exe
        working-directory: desktop
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Cunversa-Windows
          path: |
            desktop/dist/Cunversa-Setup.exe
            desktop/dist/Cunversa-Portable.exe

      - name: Publicar na aba Releases (só quando for tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/Cunversa-Setup.exe
            desktop/dist/Cunversa-Portable.exe
